name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nextfinup_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DB_NAME: nextfinup_db
      # root is required (not a scoped app user) so Django's test runner can CREATE/DROP the
      # ephemeral test_nextfinup_db database — see deploy notes in CLAUDE.md.
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      # mysql:8.0 이미지는 IANA 타임존 데이터(mysql.time_zone_name 등)가 비어있는 채로 뜬다.
      # KSTMiddleware가 요청마다 timezone.activate(KST)를 하기 때문에, USE_TZ=True에서
      # Django가 만드는 __date 필터(scraped_at__date=... 등)가 내부적으로 CONVERT_TZ(...,
      # 'UTC', 'Asia/Seoul')를 쓰는데 이 데이터가 없으면 CONVERT_TZ가 NULL을 반환해서
      # 항상 매치 실패한다 — 등급별 일일 한도 테스트(GradeLimitTests)가 그래서 실패했었다.
      - name: Load MySQL timezone data
        run: mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -h 127.0.0.1 -uroot -proot mysql

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Django test suite
        run: python manage.py test
