<!-- 공통 실시간 시세 티커 2종(지수 + 등락률 상위/하위 개별종목) + 클릭 팝업. _header.html이
     include해서 모든 Django 페이지에 붙이고, nginx가 직접 서빙하는 정적 페이지
     (/asset-management/ 등)는 이 파일을 그대로 렌더링하는 /partials/ticker/를 fetch해서 붙인다.
     단일 소스로 관리해야 두 경로가 서로 다른 버전으로 벌어지지 않는다. -->
<div class="ticker-wrap" id="tickerWrap">
    <button type="button" class="ticker-toggle-btn" id="tickerHideBtn" onclick="setTickerHidden(true)">✕ 티커 숨기기</button>
    <div class="ticker-bar" id="indexTicker" aria-hidden="true">
        <div class="ticker-track" id="indexTickerTrack"></div>
    </div>
    <div class="ticker-bar ticker-bar-alt" id="stockTicker" aria-hidden="true">
        <div class="ticker-track" id="stockTickerTrack"></div>
    </div>
</div>
<button type="button" class="ticker-show-btn" id="tickerShowBtn" onclick="setTickerHidden(false)" style="display:none;">📈 티커 보기</button>
<div class="ticker-popup" id="tickerPopup" role="dialog" aria-hidden="true">
    <button type="button" class="ticker-popup-close" id="tickerPopupClose" aria-label="닫기">&times;</button>
    <div class="ticker-popup-name" id="tickerPopupName"></div>
    <div class="ticker-popup-row"><span>현재가</span><strong id="tickerPopupPrice"></strong></div>
    <div class="ticker-popup-row"><span>전일대비</span><strong id="tickerPopupAmount"></strong></div>
    <div class="ticker-popup-row"><span>등락률</span><strong id="tickerPopupChange"></strong></div>
    <a href="#" class="ticker-popup-link" id="tickerPopupLink">종목 상세보기 →</a>
</div>
<div class="ticker-popup" id="indexFlowPopup" role="dialog" aria-hidden="true">
    <button type="button" class="ticker-popup-close" id="indexFlowPopupClose" aria-label="닫기">&times;</button>
    <div class="ticker-popup-name" id="indexFlowPopupName"></div>
    <div class="ticker-popup-row"><span>현재지수</span><strong id="indexFlowPopupPrice"></strong></div>
    <div class="ticker-popup-row"><span>전일대비</span><strong id="indexFlowPopupChangeAmount"></strong></div>
    <div class="ticker-popup-row"><span>등락률</span><strong id="indexFlowPopupChangePct"></strong></div>
    <hr style="border:0;border-top:1px solid var(--border-light, #e9ecef);margin:6px 0;">
    <div class="ticker-popup-row"><span>개인</span><strong id="indexFlowPopupRetail"></strong></div>
    <div class="ticker-popup-row"><span>외국인</span><strong id="indexFlowPopupForeign"></strong></div>
    <div class="ticker-popup-row"><span>기관</span><strong id="indexFlowPopupInstitution"></strong></div>
</div>
<style>
    /* 티커 전체를 한 번에 껐다 켤 수 있는 토글 — 켜진 상태에서는 두 티커 바 오른쪽 끝에 작게
       겹쳐 뜨고(z-index로 위에 얹혀 클릭돼도 티커 항목 팝업과 안 겹치게 wrap 바깥에 둠), 끄면
       ticker-wrap 자체가 사라지고 화면 우상단에 작은 "티커 보기" 알약 버튼만 고정으로 남는다.
       localStorage에 상태를 남겨 재방문 시에도 유지된다. */
    .ticker-wrap { position: relative; }
    .ticker-toggle-btn {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        z-index: 5;
        background: rgba(255, 255, 255, 0.12);
        color: #cfd8e3;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 11px;
        line-height: 1.6;
        white-space: nowrap;
        cursor: pointer;
    }
    .ticker-toggle-btn:hover { background: rgba(255, 255, 255, 0.24); color: var(--color-white, #fff); }
    .ticker-show-btn {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1025;
        background: #0d1b2a;
        color: var(--color-white, #fff);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .ticker-show-btn:hover { background: #142a3d; }

    /* 실시간 시세 티커: KOSPI/KOSDAQ 지수 + 등락률 상위/하위 종목이 오른쪽에서 왼쪽으로 흘러감.
       내용을 두 번 반복해 붙이고 -50% 지점까지만 이동시키면 이음매 없이 무한 반복되는 것처럼
       보인다(한국투자증권 홈페이지 지수 티커와 동일한 기법). */
    .ticker-bar {
        background: #0d1b2a;
        overflow: hidden;
        white-space: nowrap;
    }
    .ticker-bar.ticker-bar-alt {
        background: #142a3d; /* 위 지수 티커보다 살짝 밝은 톤으로 구분 */
    }
    .ticker-track {
        display: inline-flex;
        align-items: center;
        animation: ticker-scroll 40s linear infinite;
        will-change: transform;
    }
    /* 개별 종목 티커는 방향을 반대로(왼쪽→오른쪽) + 속도/시작 시점도 따로 둬서, 위 지수 티커와
       같은 타이밍으로 묶여 움직이는 것처럼 보이지 않게 한다(각 트랙에 JS가 서로 다른
       animationDuration/animationDelay를 부여함 — 아래 fitAnimationSpeed 참고). */
    .ticker-bar-alt .ticker-track {
        animation-name: ticker-scroll-reverse;
    }
    .ticker-bar:hover .ticker-track { animation-play-state: paused; }
    @keyframes ticker-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
    }
    @keyframes ticker-scroll-reverse {
        from { transform: translateX(-50%); }
        to { transform: translateX(0); }
    }
    .ticker-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 20px;
        font-size: 13px;
        white-space: nowrap;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ticker-item .ticker-name { font-weight: 700; color: var(--color-white, #fff); }
    .ticker-item .ticker-price, .ticker-item .ticker-change {
        color: #cfd8e3;
        font-variant-numeric: tabular-nums;
    }
    .ticker-item .ticker-change.up { color: #ff5252; }
    .ticker-item .ticker-change.down { color: #4fa8ff; }
    .ticker-item .ticker-change.zero { color: #9aa5b1; }
    /* 개별 종목 티커(ticker-bar-alt)는 data-ticker가 있는 항목만, 지수 티커는 코스피/코스닥처럼
       data-flows(수급 주체별 순매수)가 있는 항목만 클릭 가능 — 해외지수/환율/금리는 클릭 대상 아님 */
    .ticker-bar-alt .ticker-item[data-ticker] { cursor: pointer; }
    .ticker-bar-alt .ticker-item[data-ticker]:hover { background: rgba(255, 255, 255, 0.08); }
    #indexTicker .ticker-item[data-flows] { cursor: pointer; }
    #indexTicker .ticker-item[data-flows]:hover { background: rgba(255, 255, 255, 0.08); }

    /* 종목 클릭 시 뜨는 레이어 팝업 */
    .ticker-popup {
        display: none;
        position: fixed;
        z-index: 1030;
        background: var(--color-white, #fff);
        color: var(--text-primary, #212529);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        padding: 14px 16px;
        min-width: 200px;
    }
    .ticker-popup.open { display: block; }
    .ticker-popup-close {
        position: absolute;
        top: 6px;
        right: 8px;
        background: none;
        border: none;
        font-size: 16px;
        line-height: 1;
        color: var(--text-disabled, #adb5bd);
        cursor: pointer;
        padding: 4px;
    }
    .ticker-popup-close:hover { color: var(--text-secondary, #495057); }
    .ticker-popup-name { font-weight: 800; font-size: 14px; margin: 0 20px 8px 0; }
    .ticker-popup-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 13px;
        color: var(--text-muted, #6c757d);
        padding: 3px 0;
    }
    .ticker-popup-row strong { color: var(--text-primary, #212529); font-variant-numeric: tabular-nums; }
    .ticker-popup-row strong.up { color: #e03131; }
    .ticker-popup-row strong.down { color: #1971c2; }
    .ticker-popup-row strong.zero { color: var(--text-secondary, #495057); }
    .ticker-popup-link {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        font-weight: 700;
        color: var(--brand-primary, #0d47a1);
        text-decoration: none;
    }
    .ticker-popup-link:hover { text-decoration: underline; }
</style>
<script>
(function () {
    function setTickerHidden(hidden) {
        // 온/오프 상태를 localStorage에 남겨 재방문·다른 페이지 이동 시에도 유지되게 한다.
        try { localStorage.setItem('nextfinup_ticker_hidden', hidden ? '1' : '0'); } catch (e) {}
        var wrap = document.getElementById('tickerWrap');
        var showBtn = document.getElementById('tickerShowBtn');
        if (wrap) wrap.style.display = hidden ? 'none' : '';
        if (showBtn) showBtn.style.display = hidden ? '' : 'none';
        if (!hidden) {
            // 숨겨진 동안에는 fitAnimationSpeed가 scrollWidth=0이라 duration을 못 맞추고
            // 기본 CSS 40s로 남아있었다(실제 폭 기준으로는 그보다 훨씬 길어야 하는 경우가
            // 많아 다시 보이면 빨라 보임). 콘텐츠 자체는 숨겨진 동안에도 60초마다 계속
            // 갱신되고 있었으므로, fetch 응답을 기다리지 않고 지금 화면에 이미 있는 내용
            // 기준으로 즉시 재계산한다(scrollWidth 읽기가 강제로 레이아웃을 확정시키므로
            // display 복원 직후에 읽어도 정확하다) — 그래야 "보기" 누르자마자 바로 정상
            // 속도로 보이고, 1~2초짜리 빨라지는 순간이 안 생긴다.
            var indexTrack = document.getElementById('indexTickerTrack');
            var stockTrack = document.getElementById('stockTickerTrack');
            if (indexTrack) fitAnimationSpeed(indexTrack, 70, 0);
            if (stockTrack) fitAnimationSpeed(stockTrack, 38, 6);
            // 최신 시세 갱신은 그대로 백그라운드로 이어서 진행.
            loadIndexTicker();
            loadStockTicker();
        }
    }
    window.setTickerHidden = setTickerHidden; // 인라인 onclick에서 호출하기 위해 전역 노출

    // 페이지 로드 시 저장된 상태를 바로 반영 — 스크립트가 ticker-wrap 마크업 바로 뒤에 있어
    // 켜져 있던 화면이 잠깐 보였다 사라지는 깜빡임이 거의 없다.
    try {
        if (localStorage.getItem('nextfinup_ticker_hidden') === '1') { setTickerHidden(true); }
    } catch (e) { /* localStorage 접근 불가 시 기본값(표시)으로 둔다 */ }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function renderItemsHtml(items) {
        return items.map(function (it) {
            var pct = it.change_pct || 0;
            var dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'zero');
            var arrow = dir === 'up' ? '▲' : (dir === 'down' ? '▼' : '－');
            var priceStr = Number(it.price).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
            var pctStr = Math.abs(pct).toFixed(2);
            // data-* 속성에 원본 값을 실어두면, 클릭 시 다시 API를 안 불러도 팝업에 바로 쓸 수 있다.
            // data-ticker는 개별 종목(RankedMover)에만 있고 지수/환율/금리 항목엔 없다 — CSS의
            // .ticker-item[data-ticker] 커서 표시와 클릭 핸들러가 이 값의 유무로 클릭 가능 여부를 가른다.
            var tickerAttr = it.ticker ? ' data-ticker="' + escapeHtml(it.ticker) + '"' : '';
            // has_detail=false면 이 티커가 StockItem 마스터에 없는 상품(ETN 등)이라
            // /stocks/<ticker>/가 404를 낸다 — 팝업의 "종목 상세보기" 링크를 네이버 증권으로
            // 대신 보내야 하므로 표시해둔다.
            var hasDetailAttr = (it.ticker && it.has_detail === false) ? ' data-no-detail="1"' : '';
            // change_amount(전일대비 금액, 부호 포함)는 개별 종목(ticker_stocks_view)에만 있다.
            var amountAttr = '';
            if (typeof it.change_amount === 'number') {
                // 등락률(arrow)과 같은 표기로 통일 — +/- 대신 ▲/▼.
                var amountArrow = it.change_amount > 0 ? '▲' : (it.change_amount < 0 ? '▼' : '－');
                var amountStr = Math.abs(it.change_amount).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
                amountAttr = ' data-amount="' + amountArrow + ' ' + amountStr + '원"';
            }
            // flows(개인/외국인/기관 순매수 금액, 억원)는 코스피/코스닥(ticker_data_view)에만 있다.
            // change(전일대비, 포인트 단위)도 코스피/코스닥 팝업이 지수 자체 정보도 같이 보여줄 수
            // 있도록 함께 싣는다 — 종목의 change_amount(원)와 단위가 달라 별도 속성으로 둔다.
            var flowsAttr = '';
            if (it.flows) {
                // 종목 티커의 전일대비(▲/▼)와 같은 표기로 통일.
                var idxChangeArrow = it.change > 0 ? '▲' : (it.change < 0 ? '▼' : '－');
                var idxChangeStr = Math.abs(it.change || 0).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
                flowsAttr =
                    ' data-flows="1"' +
                    ' data-retail="' + it.flows.retail + '"' +
                    ' data-foreign="' + it.flows.foreign + '"' +
                    ' data-institution="' + it.flows.institution + '"' +
                    ' data-index-change="' + idxChangeArrow + ' ' + idxChangeStr + '"';
            }
            return '<span class="ticker-item"' + tickerAttr + hasDetailAttr + amountAttr + flowsAttr +
                ' data-name="' + escapeHtml(it.name) + '"' +
                ' data-price="' + priceStr + '"' +
                ' data-change="' + arrow + ' ' + pctStr + '%"' +
                ' data-dir="' + dir + '">' +
                '<span class="ticker-name">' + escapeHtml(it.name) + '</span>' +
                '<span class="ticker-price">' + priceStr + '</span>' +
                '<span class="ticker-change ' + dir + '">' + arrow + ' ' + pctStr + '%</span>' +
                '</span>';
        }).join('');
    }

    function fitAnimationSpeed(track, pxPerSecond, delaySeconds) {
        // 항목 개수에 관계없이 체감 속도가 일정하도록, 실제 폭에 맞춰 애니메이션 길이를 다시 계산한다.
        // pxPerSecond/delaySeconds를 티커마다 다르게 줘서 두 티커가 같은 타이밍으로 묶여 보이지
        // 않게 한다(속도도 다르고, 음수 delay로 시작 지점도 어긋나게).
        var singleLoopWidth = track.scrollWidth / 2; // 내용을 두 번 반복했으므로 절반이 한 바퀴
        // "티커 숨기기"로 ticker-wrap이 display:none인 동안에도 60초 폴링은 계속 돌아 이 함수가
        // 호출되는데, 숨겨진 요소는 scrollWidth가 항상 0이라 이 값을 그대로 쓰면 duration이
        // 15초 바닥값으로 떨어져 "보기"로 다시 켰을 때 애니메이션이 비정상적으로 빨라진다.
        // 실제 폭을 잴 수 없는 상태면 계산을 건너뛰고 기존 duration/delay를 그대로 둔다.
        if (!singleLoopWidth) return;
        var duration = Math.max(singleLoopWidth / pxPerSecond, 15);
        track.style.animationDuration = duration + 's';
        track.style.animationDelay = (-delaySeconds) + 's';
    }

    // 1번째 티커: 국내지수(+ 추후 해외지수/환율/금리/유가/금시세/원자재)
    function loadIndexTicker() {
        var track = document.getElementById('indexTickerTrack');
        if (!track) return;
        fetch('/api/ticker/')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.items || [];
                if (!items.length) return;
                var html = renderItemsHtml(items);
                track.innerHTML = html + html; // 이음매 없는 순환을 위해 두 번 반복
                fitAnimationSpeed(track, 70, 0);
            })
            .catch(function () { /* 다음 폴링에서 재시도 */ });
    }

    // 2번째 티커: 등락률 상위/하위 개별 종목(RankedMover)
    function loadStockTicker() {
        var track = document.getElementById('stockTickerTrack');
        if (!track) return;
        fetch('/api/ticker/stocks/')
            .then(function (res) { return res.json(); })
            .then(function (data) {
                var items = data.items || [];
                if (!items.length) return;
                var html = renderItemsHtml(items);
                track.innerHTML = html + html; // 이음매 없는 순환을 위해 두 번 반복
                fitAnimationSpeed(track, 38, 6);
            })
            .catch(function () { /* 다음 폴링에서 재시도 */ });
    }

    loadIndexTicker();
    setInterval(loadIndexTicker, 60000);
    loadStockTicker();
    setInterval(loadStockTicker, 60000);

    // 종목 티커 클릭 → 레이어 팝업으로 현재가/등락률을 살짝 보여줌. 트랙 내용은 60초마다
    // 통째로 다시 그려지므로, 항목이 아니라 안 바뀌는 바깥 컨테이너(#stockTicker)에
    // 이벤트를 위임해서 매번 리스너를 다시 붙일 필요가 없게 한다.
    var stockTickerEl = document.getElementById('stockTicker');
    var popup = document.getElementById('tickerPopup');
    if (stockTickerEl && popup) {
        var popupName = document.getElementById('tickerPopupName');
        var popupPrice = document.getElementById('tickerPopupPrice');
        var popupAmount = document.getElementById('tickerPopupAmount');
        var popupChange = document.getElementById('tickerPopupChange');
        var popupLink = document.getElementById('tickerPopupLink');
        var popupClose = document.getElementById('tickerPopupClose');

        function closePopup() {
            popup.classList.remove('open');
            popup.setAttribute('aria-hidden', 'true');
        }

        function openPopupFor(itemEl) {
            var ticker = itemEl.getAttribute('data-ticker');
            if (!ticker) return; // 지수/환율/금리 항목은 클릭 대상 아님

            var dir = itemEl.getAttribute('data-dir');
            popupName.textContent = itemEl.getAttribute('data-name');
            popupPrice.textContent = itemEl.getAttribute('data-price') + '원';
            popupAmount.textContent = itemEl.getAttribute('data-amount') || '-';
            popupAmount.className = dir; // 등(상승)=빨간색, 락(하락)=파란색 — 등락률과 동일한 색 규칙
            popupChange.textContent = itemEl.getAttribute('data-change');
            popupChange.className = dir;
            if (itemEl.hasAttribute('data-no-detail')) {
                // StockItem 마스터에 없는 티커(ETN 등) — 내부 상세 페이지가 404라 네이버 증권으로 대신 보낸다.
                // ETN 코드는 KIS에서 "Q" 접두사가 붙어 오지만(예: Q760027), 네이버 증권은 접두사
                // 없는 코드(760027)라야 종목 상세로 가고 붙이면 증권 메인으로 튕긴다 — 실측 확인.
                var naverCode = ticker.charAt(0) === 'Q' ? ticker.slice(1) : ticker;
                popupLink.href = 'https://stock.naver.com/domestic/stock/' + encodeURIComponent(naverCode) + '/price';
                popupLink.target = '_blank';
                popupLink.rel = 'noopener noreferrer';
                popupLink.textContent = '네이버 증권에서 보기 →';
            } else {
                popupLink.href = '/stocks/' + encodeURIComponent(ticker) + '/';
                popupLink.removeAttribute('target');
                popupLink.removeAttribute('rel');
                popupLink.textContent = '종목 상세보기 →';
            }

            // 클릭한 항목 바로 아래에 뜨도록 위치 계산(화면 밖으로 안 나가게 좌우 보정).
            var rect = itemEl.getBoundingClientRect();
            popup.classList.add('open'); // 너비 계산을 위해 먼저 보여준 뒤 위치 보정
            var popupWidth = popup.offsetWidth;
            var left = Math.min(Math.max(rect.left, 8), window.innerWidth - popupWidth - 8);
            popup.style.top = (rect.bottom + 8) + 'px';
            popup.style.left = left + 'px';
            popup.setAttribute('aria-hidden', 'false');
        }

        stockTickerEl.addEventListener('click', function (e) {
            var itemEl = e.target.closest('.ticker-item');
            if (!itemEl) return;
            openPopupFor(itemEl);
        });

        popupClose.addEventListener('click', closePopup);
        document.addEventListener('click', function (e) {
            if (popup.classList.contains('open') && !popup.contains(e.target) && !e.target.closest('.ticker-item')) {
                closePopup();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closePopup();
        });
    }

    // 지수 티커 클릭 → 코스피/코스닥(data-flows 있는 항목)만 개인/외국인/기관 순매수 금액
    // 레이어 팝업으로 보여줌. 해외지수/환율/금리는 data-flows가 없어 클릭 대상에서 자동 제외.
    var indexTickerEl = document.getElementById('indexTicker');
    var flowPopup = document.getElementById('indexFlowPopup');
    if (indexTickerEl && flowPopup) {
        var flowPopupName = document.getElementById('indexFlowPopupName');
        var flowPopupPrice = document.getElementById('indexFlowPopupPrice');
        var flowPopupChangeAmount = document.getElementById('indexFlowPopupChangeAmount');
        var flowPopupChangePct = document.getElementById('indexFlowPopupChangePct');
        var flowPopupRetail = document.getElementById('indexFlowPopupRetail');
        var flowPopupForeign = document.getElementById('indexFlowPopupForeign');
        var flowPopupInstitution = document.getElementById('indexFlowPopupInstitution');
        var flowPopupClose = document.getElementById('indexFlowPopupClose');

        function closeFlowPopup() {
            flowPopup.classList.remove('open');
            flowPopup.setAttribute('aria-hidden', 'true');
        }

        function formatFlowAmount(value) {
            var num = Number(value) || 0;
            var sign = num > 0 ? '+' : (num < 0 ? '-' : '');
            return sign + Math.abs(num).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + '억';
        }

        function flowDir(value) {
            var num = Number(value) || 0;
            return num > 0 ? 'up' : (num < 0 ? 'down' : 'zero');
        }

        function openFlowPopupFor(itemEl) {
            if (!itemEl.hasAttribute('data-flows')) return; // 해외지수/환율/금리는 클릭 대상 아님

            var dir = itemEl.getAttribute('data-dir');
            flowPopupName.textContent = itemEl.getAttribute('data-name');
            flowPopupPrice.textContent = itemEl.getAttribute('data-price');
            flowPopupChangeAmount.textContent = itemEl.getAttribute('data-index-change');
            flowPopupChangeAmount.className = dir;
            flowPopupChangePct.textContent = itemEl.getAttribute('data-change');
            flowPopupChangePct.className = dir;

            var retail = itemEl.getAttribute('data-retail');
            flowPopupRetail.textContent = formatFlowAmount(retail);
            flowPopupRetail.className = flowDir(retail);

            var foreign = itemEl.getAttribute('data-foreign');
            flowPopupForeign.textContent = formatFlowAmount(foreign);
            flowPopupForeign.className = flowDir(foreign);

            var institution = itemEl.getAttribute('data-institution');
            flowPopupInstitution.textContent = formatFlowAmount(institution);
            flowPopupInstitution.className = flowDir(institution);

            var rect = itemEl.getBoundingClientRect();
            flowPopup.classList.add('open');
            var popupWidth = flowPopup.offsetWidth;
            var left = Math.min(Math.max(rect.left, 8), window.innerWidth - popupWidth - 8);
            flowPopup.style.top = (rect.bottom + 8) + 'px';
            flowPopup.style.left = left + 'px';
            flowPopup.setAttribute('aria-hidden', 'false');
        }

        indexTickerEl.addEventListener('click', function (e) {
            var itemEl = e.target.closest('.ticker-item');
            if (!itemEl) return;
            openFlowPopupFor(itemEl);
        });

        flowPopupClose.addEventListener('click', closeFlowPopup);
        document.addEventListener('click', function (e) {
            if (flowPopup.classList.contains('open') && !flowPopup.contains(e.target) && !e.target.closest('.ticker-item')) {
                closeFlowPopup();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeFlowPopup();
        });
    }
})();
</script>
